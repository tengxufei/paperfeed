name: PaperFeed

# Runs PaperFeed on GitHub's servers, so the alert arrives whether or not the
# laptop is open. It wakes once a day and lets PaperFeed decide whether it is
# due - exactly as the LaunchAgent on the Mac does - so interval_days in the
# config sets the cadence and this file never needs editing to change it.
#
# What it needs, all under Settings -> Secrets and variables -> Actions:
#   secret    PAPERFEED_CONFIG         paperfeed/config.json, base64 on one line
#   secret    PAPERFEED_SMTP_PASSWORD  the Gmail app password (required)
#   secret    PAPERFEED_AI_KEY         the AI key (optional; ranks locally without)
#
# What it remembers between runs lives on the paperfeed-state branch: which
# papers you have already been sent, when the last digest went out, and every
# digest page so far. Nothing personal is ever committed to main.
#
# The website: when GitHub Pages is switched on for this repository
# (Settings -> Pages -> Source: GitHub Actions), every run also publishes the
# digests and dashboards there. Read-only - Save, the library and the AI
# buttons need `paperfeed serve` on the Mac. While Pages is off, the run says
# so and publishes nothing.

on:
  schedule:
    # 23:37 UTC is 07:37 in Singapore. GitHub starts scheduled jobs late when
    # it is busy, worst on the hour, so this sits early and off the hour.
    - cron: "37 23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run now even if not due (sends an email)"
        type: boolean
        default: false

permissions:
  contents: write          # to save what has been sent to paperfeed-state
  pages: read              # to ask whether the website is switched on
  actions: write           # to keep this schedule switched on (see the last step)

concurrency:
  group: paperfeed         # never two runs at once over the same memory
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      site: ${{ steps.site.outputs.ready }}
    env:
      # Calendar days are counted in YOUR days. On UTC, a run delayed past
      # midnight would count a day early or late and shift the schedule.
      TZ: Asia/Singapore
      PAPERFEED_SMTP_PASSWORD: ${{ secrets.PAPERFEED_SMTP_PASSWORD }}
      PAPERFEED_AI_KEY: ${{ secrets.PAPERFEED_AI_KEY }}

    steps:
      - uses: actions/checkout@v7
        with:
          path: app

      - uses: actions/checkout@v7
        with:
          ref: paperfeed-state
          path: saved

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the one outside package
        run: python -m pip install --quiet requests

      - name: Write config and restore memory
        working-directory: app/paperfeed
        # A secret, not a variable: GitHub prints every variable a step uses at
        # the top of that step's log, which put the whole config - address,
        # topics, interest lines - into every run's log. Secrets are hidden.
        # Base64 on one line because a multi-line JSON secret is masked line by
        # line, "{" and "}" included, which garbles the rest of the log.
        env:
          PAPERFEED_CONFIG: ${{ secrets.PAPERFEED_CONFIG }}
        run: |
          if [ -z "$PAPERFEED_CONFIG" ]; then
            echo "::error::The PAPERFEED_CONFIG secret is empty. Set it from your laptop: base64 -i paperfeed/config.json | tr -d '\\n' | gh secret set PAPERFEED_CONFIG"
            exit 1
          fi
          if [ -z "$PAPERFEED_SMTP_PASSWORD" ]; then
            echo "::error::The PAPERFEED_SMTP_PASSWORD secret is not set, so no email could be sent. Nothing was run and nothing was marked as seen."
            exit 1
          fi
          printf '%s' "$PAPERFEED_CONFIG" | base64 -d > config.json
          # Your address appears in the log ("Email sent to ..."). Masked, so
          # it stays out of the log even if this repository is ever public.
          for address in $(python -c "import json; e = json.load(open('config.json'))['email']; to = e.get('to_addresses') or []; to = [to] if isinstance(to, str) else to; c = json.load(open('config.json')); print(' '.join({a for a in to + [e.get('username', ''), e.get('from_address', ''), c.get('contact_email', '')] if a}))"); do
            echo "::add-mask::$address"
          done
          # Two differences from the laptop, both deliberate:
          #  - email is forced on: sending it is this job's whole purpose.
          #  - the collector is off: your library lives on the laptop, where
          #    you read and mark papers. A throwaway copy here would put
          #    "13 kept, 13 unread" in the email footer, which is untrue.
          python - <<'EOF'
          import json
          cfg = json.load(open("config.json", encoding="utf-8"))
          cfg.setdefault("email", {})["enabled"] = True
          cfg.setdefault("collect", {})["enabled"] = False
          json.dump(cfg, open("config.json", "w", encoding="utf-8"), indent=2)
          EOF
          mkdir -p state digests
          cp ../../saved/state/*.json state/
          if [ -d ../../saved/digests ]; then cp -R ../../saved/digests/. digests/; fi
          python paperfeed.py check

      - name: Run PaperFeed
        id: run
        working-directory: app/paperfeed
        env:
          FORCE_FLAG: ${{ inputs.force && '--force' || '' }}
        run: |
          set +e
          python paperfeed.py run $FORCE_FLAG 2>&1 | tee run.out
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if grep -qE "Email failed|could not be built" run.out; then
            echo "email_failed=true" >> "$GITHUB_OUTPUT"
          fi
          # Earlier digests were restored above, so files being present says
          # nothing about this run. Only PaperFeed's own line does.
          if grep -q "^Digest written" run.out; then
            echo "wrote=true" >> "$GITHUB_OUTPUT"
          fi
          # The summary is not a log line, so masking does not reach it.
          { echo '```'; tail -n 12 run.out | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/***/g'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # PaperFeed marks papers as seen BEFORE it sends, because on a laptop the
      # digest file stays on disk. Here nothing stays. So if the email failed,
      # the memory is NOT saved: tomorrow's run is due again and re-sends the
      # same papers, and keeps trying daily until the email gets through.
      - name: Save what has been sent
        if: steps.run.outcome == 'success' && steps.run.outputs.email_failed != 'true'
        run: |
          cp app/paperfeed/state/*.json saved/state/
          mkdir -p saved/digests
          cp -R app/paperfeed/digests/. saved/digests/
          cd saved
          git add state digests
          if git diff --cached --quiet; then
            echo "Not due, nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "PaperFeed run $(date '+%Y-%m-%d %H:%M %Z')"
          git push --quiet

      - name: Keep the digest for 30 days
        if: steps.run.outputs.wrote == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ github.run_number }}
          path: |
            app/paperfeed/digests/
            app/paperfeed/paperfeed.log
          retention-days: 30

      - name: Is the website switched on?
        id: site
        if: steps.run.outcome == 'success' && steps.run.outputs.email_failed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "::notice::GitHub Pages is not switched on for this repository, so no website was published. Settings -> Pages -> Source: GitHub Actions."
          elif [ ! -f app/paperfeed/digests/latest.html ]; then
            echo "::notice::No digest has been written yet, so there is nothing to publish."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package the website
        if: steps.site.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/paperfeed/digests

      # A failed job is what makes GitHub email you about it. The email
      # failing is the one thing that must never be quiet.
      - name: Fail loudly if the email did not go
        if: steps.run.outputs.email_failed == 'true'
        run: |
          echo "::error::The email was not sent. Nothing was marked as seen, so tomorrow's run will try again with the same papers. This run's digest is attached above."
          exit 1

      - name: Note a partial run
        if: steps.run.outputs.code != '0' && steps.run.outputs.email_failed != 'true'
        run: echo "::warning::A source had a problem this run. The email says which; the rest of the run completed."

      # In a public repository GitHub switches scheduled workflows off after 60
      # days without "repository activity", and does not say what counts. The
      # runs commit to paperfeed-state every few days, which probably does -
      # but a schedule that stops quietly means alerts that stop quietly. So
      # every run also tells GitHub, through its own API, that this workflow
      # is wanted. Harmless if it turns out to be unnecessary.
      - name: Keep the schedule switched on
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/paperfeed.yml/enable" --silent

  publish:
    needs: run
    if: needs.run.outputs.site == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write         # to publish the site
      id-token: write      # GitHub's proof to Pages that this run is allowed to
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}latest.html
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
